<!doctype html>
<html lang="fr-FR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9457e7">
    <meta name="description" content="Eureka — espace client de démonstration.">
    <title>Eureka — Espace client</title>
    <link rel="stylesheet" href="https://use.typekit.net/tpf5hvt.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="client.css">
    <script src="locales.js" defer></script>
    <script src="client.js" defer></script>
  </head>
  <body>
    <!-- Navigation de l’espace client, repliable sur mobile. -->
    <a class="skip-link" href="#workspace" data-i18n="skip">Aller au contenu</a>
    <button class="sidebar-scrim" id="sidebar-scrim" type="button" tabindex="-1" aria-label="Fermer le menu" hidden></button>
    <aside class="sidebar" id="sidebar">
      <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Fermer le menu">×</button>
      <a class="brand" href="#dashboard" aria-label="Eureka">
        <img src="../images/Eureka25.png" alt="Eureka">
      </a>
      <p class="workspace-label" data-i18n="clientArea">ESPACE CLIENT</p>
      <nav id="primary-nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-bottom">
        <div class="demo-card">
          <span class="demo-dot" aria-hidden="true"></span>
          <strong data-i18n="demo">Espace de démonstration</strong>
          <p data-i18n="demoShort">Des services fictifs, un espace à explorer.</p>
        </div>
        <a class="website-link" href="../website/index.html"><span aria-hidden="true">↗</span> <span data-i18n="backWebsite">Retour au site Eureka</span></a>
        <a class="profile-link" href="#account" id="sidebar-profile"></a>
      </div>
    </aside>

    <!-- En-tête de l’application : page active et langue. -->
    <div class="app-shell">
      <header class="app-header">
        <div class="header-left">
          <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Ouvrir le menu">☰</button>
          <span class="breadcrumb">Eureka <span aria-hidden="true">/</span> <strong id="breadcrumb-page"></strong></span>
        </div>
        <div class="header-right">
          <span class="demo-badge" data-i18n="demoBadge">DÉMO</span>
          <label class="locale-control">
            <span class="sr-only" data-i18n="language">Langue</span>
            <select id="locale-select">
              <option value="en-US" lang="en-US">EN — English (US)</option>
              <option value="fr-FR" lang="fr-FR" selected>FR — Français (France)</option>
              <option value="es-ES" lang="es-ES">ES — Español (España)</option>
              <option value="de-DE" lang="de-DE">DE — Deutsch</option>
              <option value="ja-JP" lang="ja-JP">JP — 日本語</option>
              <option value="zh-CN" lang="zh-CN">CH — 简体中文</option>
            </select>
          </label>
          <a class="avatar header-avatar" href="#account" id="header-avatar" aria-label="Mon compte">CM</a>
        </div>
      </header>

      <!-- Les cinq vues sont rendues par client.js, sans navigation réseau. -->
      <main id="workspace" tabindex="-1"></main>
      <footer class="app-footer">
        <span>© 2026 Eureka Corporation</span>
        <span data-i18n="localOnly">Prototype local · Aucun envoi réel</span>
      </footer>
    </div>

    <!-- Détails d’un service fictif et confirmations accessibles. -->
    <dialog id="service-dialog" aria-labelledby="dialog-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>JavaScript est nécessaire pour explorer cet espace client de démonstration.</noscript>
  </body>
</html>
